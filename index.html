<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dimension Preview — for Minecraft</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --panel-2: #262a35;
    --line: #333949;
    --text: #e6e8ef;
    --muted: #9aa0b0;
    --accent: #5bc46b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
  }

  /* --- Left: form panel (MCStacker-style) --- */
  #panel {
    width: 320px; flex: none; height: 100%; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 20px;
  }
  #panel h1 { font-size: 16px; margin: 0 0 4px; }
  #panel .sub { font-size: 12px; color: var(--muted); margin: 0 0 20px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, input[type=range] { width: 100%; }
  select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  }
  .rangeval { float: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  .count { margin-top: 6px; text-align: right; font-size: 11px; color: var(--muted);
           font-variant-numeric: tabular-nums; }

  /* --- Right: render canvas --- */
  #stage { flex: 1; position: relative; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; bottom: 12px; left: 12px;
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,.4);
    padding: 4px 8px; border-radius: 4px;
  }
</style>
</head>
<body>
  <aside id="panel">
    <h1>Dimension Preview</h1>
    <p class="sub">값을 선택하면 오른쪽에 실시간 렌더링됩니다. (a preview tool for Minecraft)</p>

    <div class="field">
      <label for="block">블록 (Block)</label>
      <select id="block">
        <option value="grass">Grass Block</option>
        <option value="stone">Stone</option>
        <option value="sand">Sand</option>
        <option value="netherrack">Netherrack</option>
        <option value="snow">Snow</option>
        <option value="endstone">End Stone</option>
      </select>
    </div>

    <div class="field">
      <label for="terrain">지형 (Terrain)</label>
      <select id="terrain">
        <option value="flat">Flat</option>
        <option value="hills">Rolling Hills</option>
        <option value="spikes">Spikes</option>
      </select>
    </div>

    <div class="field">
      <label for="size">렌더 영역 (Size) <span class="rangeval" id="sizeval">16×16</span></label>
      <input type="range" id="size" min="8" max="128" step="8" value="16" />
      <div class="count" id="blockcount">— blocks</div>
    </div>

    <div class="field">
      <label for="time">시간대 (Time) <span class="rangeval" id="timeval">12:00</span></label>
      <input type="range" id="time" min="0" max="24" step="0.5" value="12" />
    </div>

    <div class="field">
      <label for="shader">셰이더 프리셋 (Shader look)</label>
      <select id="shader">
        <option value="none">None (flat)</option>
        <option value="soft" selected>Soft shadows</option>
        <option value="vibrant">Vibrant</option>
      </select>
    </div>
  </aside>

  <main id="stage">
    <div id="hint">드래그: 회전 · 휠: 줌</div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Placeholder block colors — swap for real textures later.
    const BLOCK_COLORS = {
      grass:      { top: 0x6aab3c, side: 0x8a6d43 },
      stone:      { top: 0x7d7d7d, side: 0x7d7d7d },
      sand:       { top: 0xdbcea0, side: 0xdbcea0 },
      netherrack: { top: 0x672727, side: 0x672727 },
      snow:       { top: 0xf3f6fb, side: 0xe7ecf2 },
      endstone:   { top: 0xdbdca3, side: 0xcfd096 },
    };

    const stage = document.getElementById('stage');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    camera.position.set(14, 12, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
    scene.add(sun);
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const geo = new THREE.BoxGeometry(1, 1, 1);
    let blocks = null;              // THREE.InstancedMesh, rebuilt on change
    const dummy = new THREE.Matrix4();
    let curSize = 16;               // render-area edge length (blocks), from #size

    function heightAt(x, z, terrain) {
      if (terrain === 'flat') return 0;
      if (terrain === 'hills') return Math.round(1.5 + 1.5 * Math.sin(x * 0.5) * Math.cos(z * 0.5));
      if (terrain === 'spikes') return ((x + z) % 4 === 0) ? 3 : 0;
      return 0;
    }

    function rebuild() {
      // dispose the previous instanced mesh (geometry `geo` is shared, keep it)
      if (blocks) {
        scene.remove(blocks);
        blocks.dispose();
        (Array.isArray(blocks.material) ? blocks.material : [blocks.material])
          .forEach(m => m.dispose());
      }
      const kind = document.getElementById('block').value;
      const terrain = document.getElementById('terrain').value;
      curSize = parseInt(document.getElementById('size').value, 10);
      const c = BLOCK_COLORS[kind];
      const topMat = new THREE.MeshStandardMaterial({ color: c.top });
      const sideMat = new THREE.MeshStandardMaterial({ color: c.side });
      const mats = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];

      // collect all block positions first so we know the instance count
      const half = curSize / 2;
      const positions = [];
      for (let x = -half; x < half; x++) {
        for (let z = -half; z < half; z++) {
          const h = heightAt(x, z, terrain);
          for (let y = 0; y <= h; y++) positions.push([x + 0.5, y + 0.5, z + 0.5]);
        }
      }

      // one InstancedMesh draws every block in a few draw calls, regardless of count
      blocks = new THREE.InstancedMesh(geo, mats, positions.length);
      blocks.castShadow = true;
      blocks.receiveShadow = true;
      for (let i = 0; i < positions.length; i++) {
        dummy.makeTranslation(positions[i][0], positions[i][1], positions[i][2]);
        blocks.setMatrixAt(i, dummy);
      }
      blocks.instanceMatrix.needsUpdate = true;
      scene.add(blocks);

      // grow the shadow frustum with the world so shadows aren't clipped
      const r = half + 4;
      sun.shadow.camera.left = -r; sun.shadow.camera.right = r;
      sun.shadow.camera.top = r; sun.shadow.camera.bottom = -r;
      sun.shadow.camera.updateProjectionMatrix();

      // readouts
      document.getElementById('sizeval').textContent = curSize + '×' + curSize;
      document.getElementById('blockcount').textContent =
        positions.length.toLocaleString() + ' blocks';
    }

    function applyTime() {
      const t = parseFloat(document.getElementById('time').value);
      document.getElementById('timeval').textContent =
        String(Math.floor(t)).padStart(2, '0') + ':' +
        (t % 1 ? '30' : '00');
      // Sun arc: t=0 midnight, 6 sunrise, 12 noon, 18 sunset.
      const ang = ((t - 6) / 24) * Math.PI * 2;
      const R = curSize * 1.4 + 8; // sun distance scales with the world size
      sun.position.set(Math.cos(ang) * R, Math.max(2, Math.sin(ang) * R), R * 0.4);
      const day = Math.max(0, Math.sin(ang));
      scene.background = new THREE.Color().setHSL(0.6, 0.5, 0.08 + day * 0.42);
      sun.intensity = 0.2 + day * 1.1;
    }

    function applyShader() {
      const preset = document.getElementById('shader').value;
      if (preset === 'none') { renderer.shadowMap.enabled = false; ambient.intensity = 0.9; }
      else if (preset === 'soft') { renderer.shadowMap.enabled = true; ambient.intensity = 0.4; }
      else if (preset === 'vibrant') { renderer.shadowMap.enabled = true; ambient.intensity = 0.25; }
      renderer.toneMapping = preset === 'vibrant' ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
      renderer.toneMappingExposure = preset === 'vibrant' ? 1.3 : 1.0;
      scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
    }

    ['block', 'terrain', 'size'].forEach(id =>
      document.getElementById(id).addEventListener('change', rebuild));
    document.getElementById('size').addEventListener('input', (e) => {
      document.getElementById('sizeval').textContent = e.target.value + '×' + e.target.value;
    });
    document.getElementById('time').addEventListener('input', applyTime);
    document.getElementById('shader').addEventListener('change', applyShader);

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(stage); // re-fit when the pane becomes visible

    rebuild(); applyTime(); applyShader(); resize();
    (function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
